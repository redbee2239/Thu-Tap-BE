<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow Auth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 400px; padding: 1rem; }
  .card { background: #1e293b; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
  h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; color: #38bdf8; }
  .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-radius: 8px; overflow: hidden; }
  .tab { flex: 1; padding: .6rem; text-align: center; cursor: pointer; background: #334155; border: none; color: #94a3b8; font-size: .9rem; transition: .2s; }
  .tab.active { background: #38bdf8; color: #0f172a; font-weight: 600; }
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: .8rem; color: #94a3b8; margin-bottom: .3rem; }
  input { width: 100%; padding: .7rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: .95rem; outline: none; transition: .2s; }
  input:focus { border-color: #38bdf8; }
  button { width: 100%; padding: .75rem; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-size: 1rem; font-weight: 600; cursor: pointer; transition: .2s; margin-top: .5rem; }
  button:hover { background: #7dd3fc; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { padding: .6rem; border-radius: 6px; margin-top: 1rem; font-size: .85rem; text-align: center; }
  .msg.ok { background: #064e3b; color: #6ee7b7; }
  .msg.err { background: #7f1d1d; color: #fca5a5; }
  #dashboard { display: none; }
  .user-info { background: #0f172a; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .user-info p { font-size: .85rem; color: #94a3b8; margin-bottom: .3rem; }
  .user-info span { color: #e2e8f0; font-weight: 500; }
  .token-box { background: #0f172a; border-radius: 6px; padding: .5rem; font-family: monospace; font-size: .7rem; word-break: break-all; max-height: 60px; overflow-y: auto; margin-top: .5rem; color: #94a3b8; }
  .btn-logout { background: #ef4444; margin-top: 1rem; }
  .btn-logout:hover { background: #f87171; }
</style>
</head>
<body>
<div class="container">
  <div class="card" id="authForm">
    <h1>TaskFlow</h1>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab" onclick="switchTab('register')">Đăng ký</button>
    </div>
    <form onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">Đăng nhập</button>
    </form>
    <div id="msg"></div>
  </div>

  <div class="card" id="dashboard">
    <h1>TaskFlow</h1>
    <div class="user-info">
      <p>Email: <span id="d-email"></span></p>
      <p>Vai trò: <span id="d-role"></span></p>
      <p>ID: <span id="d-id"></span></p>
    </div>
    <p style="font-size:.8rem;color:#94a3b8;margin-bottom:.3rem">Access Token:</p>
    <div class="token-box" id="d-token"></div>
    <p style="font-size:.8rem;color:#94a3b8;margin-top:.8rem;margin-bottom:.3rem">Refresh Token:</p>
    <div class="token-box" id="d-refresh"></div>
    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
    <div id="dashMsg"></div>
  </div>
</div>

<script>
const API = 'http://localhost:3000';
let currentTab = 'login';
let accessToken = localStorage.getItem('accessToken');
let refreshToken = localStorage.getItem('refreshToken');

if (accessToken) showDashboard();

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[tab === 'login' ? 0 : 1].classList.add('active');
  document.getElementById('submitBtn').textContent = tab === 'login' ? 'Đăng nhập' : 'Đăng ký';
  document.getElementById('msg').innerHTML = '';
}

function showMsg(id, text, ok) {
  document.getElementById(id).innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
}

async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    if (currentTab === 'register') {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        showMsg('msg', 'Đăng ký thành công! Chuyển sang đăng nhập.', true);
        switchTab('login');
      } else {
        showMsg('msg', data.message, false);
      }
    } else {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        accessToken = data.accessToken;
        refreshToken = data.refreshToken;
        localStorage.setItem('accessToken', accessToken);
        localStorage.setItem('refreshToken', refreshToken);
        showDashboard();
      } else {
        showMsg('msg', data.message, false);
      }
    }
  } catch (err) {
    showMsg('msg', 'Lỗi kết nối server', false);
  }
  btn.disabled = false;
}

async function showDashboard() {
  document.getElementById('authForm').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('d-token').textContent = accessToken;
  document.getElementById('d-refresh').textContent = refreshToken;

  try {
    const res = await fetch(`${API}/auth/me`, {
      headers: { 'Authorization': `Bearer ${accessToken}` }
    });
    if (res.ok) {
      const user = await res.json();
      document.getElementById('d-email').textContent = user.email;
      document.getElementById('d-role').textContent = user.role;
      document.getElementById('d-id').textContent = user.id;
    } else if (res.status === 401) {
      const refreshed = await tryRefresh();
      if (refreshed) return showDashboard();
      logout();
    }
  } catch { logout(); }
}

async function tryRefresh() {
  try {
    const res = await fetch(`${API}/auth/refresh`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refreshToken })
    });
    if (res.ok) {
      const data = await res.json();
      accessToken = data.accessToken;
      localStorage.setItem('accessToken', accessToken);
      return true;
    }
  } catch {}
  return false;
}

function logout() {
  accessToken = null;
  refreshToken = null;
  localStorage.removeItem('accessToken');
  localStorage.removeItem('refreshToken');
  document.getElementById('authForm').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  document.getElementById('msg').innerHTML = '';
}
</script>
</body>
</html>
